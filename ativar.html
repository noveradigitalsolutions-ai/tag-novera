<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ativar QR Code · Novera</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0b0b; --card:#141414; --wine:#7a1730; --wine2:#a02447;
  --t:#f4f1f1; --m:#a39d9d; --l:#2a2a2a; --ok:#6fcf97; --err:#ff8a8a;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--t);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.5;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  display:flex; justify-content:center; align-items:flex-start;
}
main{width:100%; max-width:420px; padding-top:8vh}
.marca{color:var(--m); font-size:.95rem; margin:0 0 28px; letter-spacing:.02em}
h1{font-size:1.6rem; line-height:1.2; margin:0 0 8px; font-weight:650}
.sub{color:var(--m); margin:0 0 24px}
.codigo{
  display:inline-block; font-family:ui-monospace,Menlo,Consolas,monospace;
  background:var(--card); border:1px solid var(--l); border-left:3px solid var(--wine2);
  padding:6px 12px; border-radius:6px; margin:0 0 24px; font-size:1.05rem;
}
form{display:grid; gap:18px}
label{display:grid; gap:6px; font-weight:600}
.dica{font-weight:400; color:var(--m); font-size:.9rem}
input{
  font:inherit; font-size:1rem; color:var(--t);
  background:var(--card); border:1px solid var(--l); border-radius:8px;
  padding:14px; width:100%;
}
input::placeholder{color:#6d6767}
input:focus-visible,button:focus-visible{outline:2px solid var(--wine2); outline-offset:2px}
button{
  font:inherit; font-weight:650; color:#fff; cursor:pointer;
  background:var(--wine); border:0; border-radius:8px; padding:15px;
  transition:background .15s;
}
button:hover{background:var(--wine2)}
button:disabled{opacity:.6; cursor:wait}
#msg{margin:18px 0 0; min-height:1.5em; font-weight:600}
#msg.ok{color:var(--ok)} #msg.erro{color:var(--err)}
.aviso{border:1px solid var(--l); background:var(--card); padding:16px; border-radius:8px; color:var(--m)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="marca">Novera</p>

  <section id="semCodigo" hidden>
    <h1>QR sem código</h1>
    <p class="aviso">Esta página abre sozinha quando você lê o QR Code da placa. Aproxime a câmera do QR da placa para continuar.</p>
  </section>

  <section id="ativacao" hidden>
    <h1>Ative sua placa</h1>
    <p class="sub">Digite o PIN que veio com a placa e o endereço para onde o QR deve levar.</p>
    <p class="codigo" id="codigo"></p>

    <form id="f" novalidate>
      <label for="pin">PIN da placa
        <input id="pin" name="pin" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      </label>
      <label for="dest">Endereço de destino
        <span class="dica">Ex.: instagram.com/sua.empresa ou o link do seu site</span>
        <input id="dest" name="dest" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://" required>
      </label>
      <button id="enviar" type="submit">Ativar QR Code</button>
    </form>
    <p id="msg" role="status" aria-live="polite"></p>
  </section>
</main>

<script>
(function(){
  var SUPABASE_URL = "https://ugnlemiahhnpumglujre.supabase.co";
  var CHAVE_PUBLICA = "sb_publishable_rebVOtIIrH_fGlLS3ed2ag_qRTt6imN";

  var $ = function(id){ return document.getElementById(id); };
  var code = (new URLSearchParams(location.search).get("c") || "").trim();

  if (!code) { $("semCodigo").hidden = false; return; }
  $("ativacao").hidden = false;
  $("codigo").textContent = code;

  function aviso(texto, tipo){
    var m = $("msg");
    m.textContent = texto;
    m.className = tipo || "";
  }

  function normalizaDestino(v){
    v = (v || "").trim();
    if (!v) return null;
    if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = "https://" + v;
    try {
      var u = new URL(v);
      if (u.protocol !== "https:" && u.protocol !== "http:") return null;
      if (!u.hostname || u.hostname.indexOf(".") === -1) return null;
      return u.href;
    } catch (e) { return null; }
  }

  function interpreta(res){
    var v = Array.isArray(res) ? res[0] : res;
    if (v && typeof v === "object") v = v.status || v.result || v.resultado || v.ok;
    if (v === true) return { ok: true };
    var t = String(v == null ? "" : v).toLowerCase();
    if (t === "invalido") return { erro: "PIN ou código inválido. Confira o PIN e tente de novo." };
    if (["ok","ativado","ativada","sucesso"].indexOf(t) > -1) return { ok: true };
    if (t.indexOf("ja") === 0 && t.indexOf("ativ") > -1) return { erro: "Este QR Code já foi ativado." };
    if (t.indexOf("bloque") > -1) return { erro: "Muitas tentativas. Tente de novo mais tarde." };
    return { incerto: String(v) };
  }

  $("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    var pin = $("pin").value.trim();
    var dest = normalizaDestino($("dest").value);

    if (!pin) { aviso("Digite o PIN da placa.", "erro"); $("pin").focus(); return; }
    if (!dest) { aviso("Digite um endereço válido, como instagram.com/sua.empresa.", "erro"); $("dest").focus(); return; }

    var btn = $("enviar");
    btn.disabled = true;
    aviso("Ativando…", "");

    fetch(SUPABASE_URL + "/rest/v1/rpc/nvc_activate", {
      method: "POST",
      headers: { "apikey": CHAVE_PUBLICA, "Content-Type": "application/json" },
      body: JSON.stringify({ p_code: code, p_pin: pin, p_dest: dest })
    }).then(function(r){
      return r.text().then(function(t){
        var j; try { j = JSON.parse(t); } catch (e) { j = t; }
        if (!r.ok) throw new Error((j && j.message) || ("erro " + r.status));
        return j;
      });
    }).then(function(res){
      var r = interpreta(res);
      if (r.ok) {
        aviso("QR Code ativado. Agora ele leva para " + dest + ". Leia o QR de novo para conferir.", "ok");
        $("f").hidden = true;
      } else if (r.erro) {
        aviso(r.erro, "erro");
        btn.disabled = false;
      } else {
        aviso("O servidor respondeu: “" + r.incerto + "”. Leia o QR de novo para conferir se ativou.", "");
        btn.disabled = false;
      }
    }).catch(function(){
      aviso("Não foi possível ativar agora. Verifique sua internet e tente de novo.", "erro");
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
